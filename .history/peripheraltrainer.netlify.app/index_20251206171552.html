<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="./">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peripheral Trainer</title>
    <style>
      .no-transitions * {
        transition: none !important;
      }
    </style>
    <script>
      // Fix for serving from subdirectory - redirect to base path
      (function() {
        // If we're at index.html, redirect to just the folder
        const currentPath = window.location.pathname;
        if (currentPath.endsWith('/index.html') || currentPath.includes('/index.html')) {
          const basePath = currentPath.replace('/index.html', '/').replace(/\/+$/, '/');
          if (currentPath !== basePath && basePath !== currentPath) {
            // Use hash-based navigation workaround
            if (!window.location.hash) {
              window.history.replaceState(null, '', basePath);
            }
          }
        }
      })();
      
      // Initialize theme before content loads
      (function() {
        document.documentElement.classList.add('no-transitions');
        const savedTheme = localStorage.getItem('peripheralVisionTheme') || 'light';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // Remove the no-transitions class after a brief delay
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.documentElement.classList.remove('no-transitions');
          });
        });
      })();
    </script>
    <script type="module" crossorigin src="assets/index-CZ8eiYtn.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-CRI3t5Lm.css">
    <script>
      // Add round completion detection for Brain Train Hub
      (function() {
        let hasNotifiedRoundComplete = false;
        let roundCompleteTimeout = null;
        
        function checkForGameCompletion() {
          const root = document.getElementById('root');
          if (!root) return;
          
          // Look for "Game Over" text which appears when game finishes
          const gameOverText = root.textContent || '';
          const hasGameOver = /Game Over/i.test(gameOverText);
          const hasFinished = /Your score:/i.test(gameOverText) || /Accuracy:/i.test(gameOverText);
          const hasPlayAgain = /Play Again/i.test(gameOverText);
          
          // Check if we're in finished state (has Game Over + score display + Play Again button)
          const isFinished = hasGameOver && hasFinished && hasPlayAgain;
          
          // Also check for specific button text that indicates completion
          const buttons = root.querySelectorAll('button');
          let foundPlayAgain = false;
          buttons.forEach(btn => {
            if (/Play Again/i.test(btn.textContent || '')) {
              foundPlayAgain = true;
            }
          });
          
          // If game is finished and we haven't notified yet
          if (isFinished && foundPlayAgain && !hasNotifiedRoundComplete) {
            hasNotifiedRoundComplete = true;
            
            // Clear any existing timeout
            if (roundCompleteTimeout) {
              clearTimeout(roundCompleteTimeout);
            }
            
            // Notify parent hub after a short delay to ensure UI is stable
            roundCompleteTimeout = setTimeout(() => {
              if (window.parent !== window) {
                window.parent.postMessage({ 
                  type: 'ROUND_COMPLETE', 
                  result: 'complete',
                  source: 'peripheral-trainer'
                }, '*');
              }
            }, 500);
          }
          
          // Reset notification flag when game starts again (no longer in finished state)
          if (!isFinished && hasNotifiedRoundComplete) {
            // Wait a bit before resetting to avoid false triggers
            setTimeout(() => {
              if (!/Game Over/i.test(root.textContent || '')) {
                hasNotifiedRoundComplete = false;
              }
            }, 1000);
          }
        }
        
        // Use MutationObserver to watch for DOM changes
        const observer = new MutationObserver(() => {
          checkForGameCompletion();
        });
        
        // Start observing when root is available
        function startObserving() {
          const root = document.getElementById('root');
          if (root) {
            observer.observe(root, {
              childList: true,
              subtree: true,
              characterData: true,
              attributes: true
            });
            checkForGameCompletion();
          } else {
            setTimeout(startObserving, 100);
          }
        }
        
        // Also listen for custom events
        window.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'PERIPHERAL_ROUND_COMPLETE') {
            if (window.parent !== window) {
              window.parent.postMessage({ 
                type: 'ROUND_COMPLETE', 
                result: event.data.result || 'complete',
                source: 'peripheral-trainer'
              }, '*');
            }
          }
        });
        
        // Start observing after DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startObserving);
        } else {
          startObserving();
        }
        
        // Also check periodically as a fallback
        setInterval(checkForGameCompletion, 1000);
        
        // Expose a global function that can be called manually
        window.completePeripheralRound = function(result = 'complete') {
          hasNotifiedRoundComplete = true;
          if (window.parent !== window) {
            window.parent.postMessage({ 
              type: 'ROUND_COMPLETE', 
              result: result,
              source: 'peripheral-trainer'
            }, '*');
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
